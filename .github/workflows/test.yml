name: tests

on:
  push:
  pull_request:

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run the tests
        shell: pwsh
        run: ./scripts/Invoke-Tests.ps1

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./PowerShellToolbox -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results.Where({ $_.Severity -eq 'Error' })) { exit 1 }
